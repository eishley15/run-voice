<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#292420" />
    <title>A voice note for Mau's marathon</title>
    <meta name="description" content="Send Mau a voice note before her marathon — a cheer, a laugh, a reason she's got this." />

    <!-- Open Graph / link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calling all my Marathon Cheerleaders!" />
    <meta property="og:description" content="Send Mau a voice note with your best pep talk. She's taking your voices with her to the start line." />
    <meta property="og:image" content="/portrait.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calling all my Marathon Cheerleaders!" />
    <meta name="twitter:description" content="Send Mau a voice note with your best pep talk. She's taking your voices with her to the start line." />
    <meta name="twitter:image" content="/portrait.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@400;500;600;700&family=Kalam:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Pre-hydration loading shell — shown until Vue mounts and replaces #app.
         Skeleton, not a spinner: mirrors the intro layout it's covering for. */
      #app-loading {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1.25rem;
        background: #292420;
      }
      .skel {
        background: #3a332c;
        border-radius: 3px;
        animation: skel-pulse 1.4s ease-in-out infinite;
      }
      .skel-avatar { width: 64px; height: 64px; border-radius: 999px; }
      .skel-title  { width: min(80vw, 320px); height: 28px; }
      .skel-line   { width: min(70vw, 260px); height: 14px; }
      .skel-input  { width: min(90vw, 380px); height: 44px; }
      .skel-circle { width: 88px; height: 88px; border-radius: 999px; margin-top: 0.5rem; }
      @keyframes skel-pulse {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .skel { animation: none; opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading" aria-hidden="true">
        <div class="skel skel-avatar"></div>
        <div class="skel skel-title"></div>
        <div class="skel skel-line"></div>
        <div class="skel skel-input"></div>
        <div class="skel skel-circle"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
